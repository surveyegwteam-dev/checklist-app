<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1976d2">

  <link rel="manifest" href="./manifest.json">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="รายจ่าย">

  <title>Checklist รายจ่ายประจำ</title>

  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2f5f9;
      --card: #ffffff;
      --text: #17283b;
      --muted: #536479;
      --line: #dde4ec;
      --accent: #1565c0;
      --success: #237642;
      --warn: #b33928;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 14px;
      background: var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.6;
    }

    .container {
      max-width: 480px;
      margin: auto;
      padding: 24px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 6px 28px #00000012;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      text-align: center;
    }

    .subtitle {
      margin: 6px 0 22px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    progress {
      display: block;
      width: 100%;
      height: 18px;
      accent-color: var(--success);
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid var(--line);
    }

    label {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 21px;
      height: 21px;
      flex-shrink: 0;
      accent-color: var(--success);
    }

    .amount {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .item.paid .name {
      color: var(--muted);
      text-decoration: line-through;
    }

    .summary {
      margin: 22px 0;
      padding: 16px;
      background: var(--bg);
      border-radius: 12px;
    }

    .summary p {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      margin: 5px 0;
    }

    .remaining {
      color: var(--warn);
      font-weight: bold;
    }

    .complete {
      margin: 12px 0 0;
      color: var(--success);
      font-weight: bold;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(0.93);
    }

    :focus-visible {
      outline: 3px solid #e49a00;
      outline-offset: 4px;
    }

    .notice {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .storage-error {
      color: var(--warn);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15202c;
        --card: #202e3d;
        --text: #edf3fb;
        --muted: #bdcadb;
        --line: #405064;
        --accent: #246cc2;
        --success: #80dca0;
        --warn: #ffad9e;
      }
    }

    @media (max-width: 360px) {
      .container {
        padding: 16px;
      }

      .item {
        gap: 8px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>✅ Checklist รายจ่าย</h1>

    <p class="subtitle">
      เลือกรายการที่ชำระแล้วเพื่อติดตามยอดคงเหลือ
    </p>

    <div class="progress-label">
      <label for="progress">ความคืบหน้าการชำระ</label>
      <strong id="percent">0%</strong>
    </div>

    <progress id="progress" max="100" value="0">0%</progress>

    <div id="items" aria-label="รายการรายจ่าย"></div>

    <section
      class="summary"
      aria-live="polite"
      aria-atomic="true"
    >
      <p>
        <span>ยอดรวมทั้งหมด</span>
        <strong id="total"></strong>
      </p>

      <p>
        <span>จ่ายแล้ว</span>
        <strong id="paid"></strong>
      </p>

      <p class="remaining">
        <span>คงเหลือ</span>
        <strong id="remaining"></strong>
      </p>

      <p>
        <span>รายการที่ชำระแล้ว</span>
        <span id="count"></span>
      </p>

      <div id="complete" class="complete" hidden>
        ✅ จ่ายครบแล้วทุกรายการ
      </div>
    </section>

    <button id="reset" type="button">
      🔄 เริ่มเดือนใหม่
    </button>

    <p id="storage-note" class="notice" role="status">
      บันทึกสถานะอัตโนมัติในเบราว์เซอร์นี้
      ไม่ซิงก์ข้ามอุปกรณ์
      การล้างข้อมูลเบราว์เซอร์อาจลบสถานะที่บันทึกไว้
    </p>

    <noscript>
      <p>กรุณาเปิด JavaScript ในเบราว์เซอร์เพื่อใช้งาน Checklist</p>
    </noscript>
  </main>

  <script>
    'use strict';

    (() => {
      const items = [
        { id: 'house', name: 'ค่าบ้าน', amount: 1000 },
        { id: 'condo', name: 'ค่าคอนโด', amount: 9425 },
        { id: 'uobloan', name: 'สินเชื่อ UOB', amount: 1440 },
        { id: 'uobcredit', name: 'Credit UOB', amount: 14000 },
        { id: 'kbank', name: 'Credit K Bank', amount: 4500 },
        { id: 'shopee', name: 'Shopee Easy Cash', amount: 2500 },
        { id: 'ktc', name: 'KTC', amount: 500 }
      ];

      const storageKey = 'expense-checklist-v2';

      const total = items.reduce(
        (sum, item) => sum + item.amount,
        0
      );

      const money = value =>
        value.toLocaleString('th-TH') + ' บาท';

      const list = document.getElementById('items');
      const note = document.getElementById('storage-note');

      let state = {};

      function storageWarning() {
        note.textContent =
          'เบราว์เซอร์นี้ไม่อนุญาตให้บันทึกข้อมูล ' +
          'สถานะจะคงอยู่เฉพาะขณะที่เปิดหน้านี้';

        note.classList.add('storage-error');
      }

      try {
        const saved = JSON.parse(
          localStorage.getItem(storageKey) || '{}'
        );

        if (
          saved &&
          typeof saved === 'object' &&
          !Array.isArray(saved)
        ) {
          items.forEach(item => {
            state[item.id] = saved[item.id] === true;
          });
        }
      } catch (error) {
        storageWarning();
      }

      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'item';

        const label = document.createElement('label');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = 'expense-' + item.id;
        checkbox.checked = state[item.id] === true;

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = item.name;

        const amount = document.createElement('span');
        amount.className = 'amount';
        amount.id = 'amount-' + item.id;
        amount.textContent =
          item.amount.toLocaleString('th-TH');

        checkbox.setAttribute(
          'aria-describedby',
          amount.id
        );

        label.append(checkbox, name);
        row.append(label, amount);
        list.append(row);

        checkbox.addEventListener('change', () => {
          state[item.id] = checkbox.checked;
          save();
          update();
        });
      });

      function save() {
        try {
          localStorage.setItem(
            storageKey,
            JSON.stringify(state)
          );
        } catch (error) {
          storageWarning();
        }
      }

      function update() {
        let paid = 0;
        let count = 0;

        items.forEach(item => {
          const checkbox = document.getElementById(
            'expense-' + item.id
          );

          const checked = state[item.id] === true;

          checkbox.checked = checked;

          checkbox.closest('.item').classList.toggle(
            'paid',
            checked
          );

          if (checked) {
            paid += item.amount;
            count++;
          }
        });

        const percent = total > 0
          ? Math.min(100, Math.max(0, paid / total * 100))
          : 0;

        document.getElementById('total').textContent =
          money(total);

        document.getElementById('paid').textContent =
          money(paid);

        document.getElementById('remaining').textContent =
          money(total - paid);

        document.getElementById('count').textContent =
          count + ' / ' + items.length;

        document.getElementById('percent').textContent =
          Math.round(t progress = document.getElementById('progress');

        progress.value = percent;
        progress.textContent = Math.round(percent) + '%';

        document.getElementById('complete').hidden =
          count !== items.length;
      }

      document.getElementById('reset').addEventListener(
        'click',
        () => {
          const confirmed = window.confirm(
            'เริ่มเดือนใหม่และล้างเครื่องหมายชำระแล้วทุกรายการ?'
          );

          if (!confirmed) return;

          state = {};
          save();
          update();
        }
      );

      update();
    })();
  </script>

  <script>
    if (
      'serviceWorker' in navigator &&
      location.protocol === 'https:'
    ) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./service-worker.js')
          .catch(() => {
            const note = document.getElementById('storage-note');

            note.textContent +=
              ' ขณะนี้ยังไม่พร้อมใช้งานออฟไลน์ ' +
              'กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วเปิดใหม่';
          });
      });
    }
  </script>
</body>
</html>
